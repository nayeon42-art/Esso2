<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>إيسو | وكالة التأمين السودانية</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
scroll-behavior:smooth;
}

body{
background:#f4f7fb;
color:#111;
overflow-x:hidden;
}

header{
background:#071a33;
padding:20px 8%;
display:flex;
justify-content:space-between;
align-items:center;
position:sticky;
top:0;
z-index:999;
}

.logo{
font-size:32px;
font-weight:700;
color:white;
}

nav a{
color:white;
text-decoration:none;
margin:0 12px;
font-size:16px;
}

.hero{
height:95vh;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
padding:40px;
background:linear-gradient(rgba(7,26,51,.82),rgba(7,26,51,.82)),
url('https://images.unsplash.com/photo-1503376780353-7e6692767b70?q=80&w=2070')
center/cover;
color:white;
}

.hero-content{max-width:850px;}

.hero-content h1{font-size:60px;margin-bottom:20px;}

.hero-content p{font-size:21px;line-height:2;margin-bottom:35px;}

.hero button{
padding:16px 40px;
border:none;
border-radius:14px;
background:#2d8fff;
color:white;
font-size:18px;
cursor:pointer;
}

.section-title{
text-align:center;
font-size:42px;
margin-bottom:50px;
color:#071a33;
}

.features{
padding:100px 8%;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:25px;
}

.card{
background:white;
padding:35px;
border-radius:24px;
box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.agencies{
padding:100px 8%;
background:white;
}

.agency-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:25px;
}

.agency{
background:#f7fbff;
padding:35px;
border-radius:24px;
border:1px solid #dce8f5;
}

.calculator,.scan-box,.claims,.payment{
padding:100px 8%;
}

.form-box,.claim-box,.payment-box{
max-width:700px;
margin:auto;
display:grid;
gap:20px;
}

input,select,textarea{
padding:16px;
border-radius:14px;
border:1px solid #ccc;
font-size:16px;
width:100%;
}

textarea{height:140px;resize:none;}

button{
padding:16px;
background:#071a33;
color:white;
border:none;
border-radius:14px;
font-size:18px;
cursor:pointer;
}

button:hover{background:#2d8fff;}

.price-result{
text-align:center;
font-size:30px;
font-weight:700;
color:#2d8fff;
}

.hidden{display:none;}

.contact{
padding:100px 8%;
background:#071a33;
color:white;
text-align:center;
}

footer{
background:#04111f;
padding:25px;
text-align:center;
color:#bbb;
}

@media(max-width:768px){
.hero-content h1{font-size:38px;}
nav{display:none;}
}

</style>

</head>

<body>

<header>
<div class="logo">إيسو</div>
<nav>
<a href="#">الرئيسية</a>
<a href="#calculator">احسب</a>
<a href="#claims">الطلب</a>
<a href="#payment">الدفع</a>
</nav>
</header>

<section class="hero">
<div class="hero-content">
<h1>إيسو لوكالة التأمين السودانية</h1>
<p>نظام تأمين إلكتروني. الطلب أولاً، الدفع لاحقاً بعد الموافقة. نعم، بهذه البساطة المنطقية.</p>
<button onclick="document.getElementById('claims').scrollIntoView()">ابدأ</button>
</div>
</section>

<section class="claims" id="claims">

<h2 class="section-title">تقديم طلب تأمين</h2>

<form class="claim-box" id="claimForm" action="https://formspree.io/f/xdablqqn" method="POST">

<input type="text" name="full_name" placeholder="الاسم" required>
<input type="email" name="email" placeholder="الإيميل" required>
<input type="text" name="phone" placeholder="الهاتف" required>
<input type="text" name="car_type" placeholder="السيارة" required>
<textarea name="details" placeholder="تفاصيل الطلب" required></textarea>

<button type="submit">إرسال الطلب</button>

</form>

<div id="statusMsg" style="text-align:center;margin-top:20px;"></div>

</section>

<section class="payment hidden" id="payment">

<h2 class="section-title">الدفع بعد الموافقة</h2>

<form class="payment-box" action="https://formspree.io/f/xdablqqn" method="POST">

<input type="text" name="sender_name" placeholder="اسم المحول" required>
<input type="number" name="amount" placeholder="المبلغ" required>
<input type="file" name="receipt" required>

<div style="background:#eef5fc;padding:20px;border-radius:16px;text-align:center;">
رقم الحساب<br><b>02513629730001</b>
</div>

<button type="submit">إرسال الدفع</button>

</form>

</section>

<script>

let approved = false;

document.getElementById("claimForm").addEventListener("submit", async function(e){
e.preventDefault();

let form = e.target;
let data = new FormData(form);

await fetch(form.action,{
method:"POST",
body:data,
headers:{'Accept':'application/json'}
});

form.style.display="none";

document.getElementById("statusMsg").innerHTML =
"طلبك وصل. الآن انتظر الموافقة (أيوه، زي أي نظام محترم في العالم).";

// محاكاة موافقة الإدارة
setTimeout(()=>{
approved = true;
document.getElementById("payment").classList.remove("hidden");
document.getElementById("statusMsg").innerHTML =
"تمت الموافقة. يمكنك الدفع الآن.";
},5000);

});

</script>

</body>
</html>
