<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل دخول الموظفين — إيسو</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="login.css">
</head>
<body>

<main class="login-screen">
  <div class="login-inner">
    <a href="index.html" class="logo-script">Esso</a>

    <h1>تسجيل دخول الموظفين</h1>
    <p class="login-hint">سجّلي دخولك للوصول للوحة تحكم الطلبات</p>

    <form class="login-form" id="loginForm">
      <label>
        البريد الإلكتروني
        <input type="email" id="loginEmail" placeholder="أدخل بريدك الإلكتروني" required>
      </label>

      <label>
        كلمة المرور
        <div class="pw-field">
          <input type="password" id="loginPassword" placeholder="أدخل كلمة المرور" required>
          <button type="button" class="pw-toggle" aria-label="إظهار كلمة المرور">👁</button>
        </div>
      </label>

      <div class="login-row">
        <label class="remember">
          <input type="checkbox">
          تذكرني
        </label>
      </div>

      <button type="submit" class="btn btn-gold btn-block">تسجيل دخول</button>
      <p class="form-status" id="loginStatus" hidden></p>
      <a href="#" class="forgot-link">نسيت كلمة المرور؟</a>
    </form>
  </div>
</main>

<script type="module" src="auth-gate.js"></script>
</body>
</html>
