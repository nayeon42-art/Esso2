<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل حساب موظف — إيسو</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="login.css">
</head>
<body>

<main class="login-screen">
  <div class="login-inner">
    <a href="index.html" class="logo-script">Esso</a>

    <h1>إنشاء حساب موظف</h1>
    <p class="login-hint">محتاجة كود الدخول اللي معاكي من المسؤولة</p>

    <form class="login-form" id="registerForm">
      <label>
        الاسم الكامل
        <input type="text" id="regName" placeholder="أدخلي اسمك الكامل" required>
      </label>

      <label>
        البريد الإلكتروني
        <input type="email" id="regEmail" placeholder="أدخلي بريدك الإلكتروني" required>
      </label>

      <label>
        كلمة المرور
        <div class="pw-field">
          <input type="password" id="regPassword" placeholder="6 أحرف على الأقل" minlength="6" required>
          <button type="button" class="pw-toggle" aria-label="إظهار كلمة المرور">👁</button>
        </div>
      </label>

      <label>
        كود الدخول الخاص بالموظفين
        <input type="text" id="regCode" placeholder="اسألي المسؤولة عن الكود" required>
      </label>

      <button type="submit" class="btn btn-gold btn-block">إنشاء الحساب</button>
      <p class="form-status" id="registerStatus" hidden></p>
      <a href="login.html" class="forgot-link">عندك حساب بالفعل؟ سجّلي دخول</a>
    </form>
  </div>
</main>

<script type="module" src="auth-gate.js"></script>
</body>
</html>
